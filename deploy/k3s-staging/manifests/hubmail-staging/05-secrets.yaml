# Secrets from Infisical prod folder /hubmail-staging (create it before syncing):
#   MYSQL_PASS         grommunio DB user password
#   MYSQL_ROOT_PASS    MariaDB root password
#   ADMIN_PASS         grommunio admin UI password (re-applied on every boot)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: {name: infisical-hubmail-staging}
spec:
  provider:
    infisical:
      auth:
        universalAuthCredentials:
          clientId: {key: clientId, name: infisical-machine-identity, namespace: external-secrets}
          clientSecret: {key: clientSecret, name: infisical-machine-identity, namespace: external-secrets}
      hostAPI: http://infisical.infisical.svc.cluster.local:8080/api
      secretsScope: {environmentSlug: staging, projectSlug: platform-an7x, secretsPath: /hubmail-staging, recursive: false, expandSecretReferences: true}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: hubmail-secrets, namespace: hubmail-staging}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: infisical-hubmail-staging, kind: ClusterSecretStore}
  target: {name: hubmail-secrets, creationPolicy: Owner}
  dataFrom:
    - find: {name: {regexp: ".*"}}
---
# Same values, in the key names mariadb-operator expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: hubmail-db-credentials, namespace: hubmail-staging}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: infisical-hubmail-staging, kind: ClusterSecretStore}
  target: {name: hubmail-db-credentials, creationPolicy: Owner}
  data:
    - {secretKey: root-password, remoteRef: {key: MYSQL_ROOT_PASS}}
    - {secretKey: password, remoteRef: {key: MYSQL_PASS}}
---
# Wasabi credentials shared by all backups (existing store, /boca-k3-backup).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: backup-s3, namespace: hubmail-staging}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: infisical-backups, kind: ClusterSecretStore}
  target: {name: backup-s3, creationPolicy: Owner}
  dataFrom:
    - find: {name: {regexp: "^BACKUP_S3_"}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: ghcr-pull, namespace: hubmail-staging}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: infisical-staging, kind: ClusterSecretStore}
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .user }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .user .token | b64enc }}"}}}'
  data:
    - {secretKey: user, remoteRef: {key: GHCR_USER}}
    - {secretKey: token, remoteRef: {key: GHCR_TOKEN}}
