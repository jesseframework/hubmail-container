# Piraeus (LINSTOR/DRBD) operator: replicated block storage for HubMail mailbox volumes only.
# The rest of the cluster stays on local-path.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: piraeus-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/piraeusdatastore/piraeus-operator
    targetRevision: v2.10.0
    path: config/default
  destination:
    server: https://kubernetes.default.svc
    namespace: piraeus-datastore
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
