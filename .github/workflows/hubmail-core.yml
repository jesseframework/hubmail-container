name: hubmail-core image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      admin_api_ref:
        description: "hubmail-admin-api branch or tag to overlay"
        default: master

env:
  IMAGE: ghcr.io/jesseframework/hubmail-core

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (load for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gromox-core/Dockerfile
          platforms: linux/amd64
          load: true
          tags: hubmail-core:ci
          build-args: |
            HUBMAIL_ADMIN_API_REF=${{ inputs.admin_api_ref || 'master' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - HubMail license default and package record
        run: |
          docker run --rm --entrypoint /bin/bash hubmail-core:ci -c '
            set -e
            cat /etc/hubmail/packages.txt
            echo "admin-api commit: $(cat /etc/hubmail/admin-api.commit)"
            cd /usr/share/grommunio-admin-api
            python3 -c "from tools.license import getLicense as g; l=g(); print(l.product, l.users); assert l.product == \"HubMail\" and l.users >= 100000, \"cap patch missing\""
          '

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gromox-core/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HUBMAIL_ADMIN_API_REF=${{ inputs.admin_api_ref || 'master' }}
          cache-from: type=gha
